name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: false
      - name: Check shell syntax
        run: sh -n run.sh cleanup.sh
      - name: Run isolated lifecycle tests
        run: go test -v ./...
